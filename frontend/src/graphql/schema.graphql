"""
Analytics converted into a reporting currency at cached reference rates. Stored salaries are never changed.
"""
type ConvertedDashboard {
  """
  False when no rates have been fetched yet
  """
  available: Boolean!
  distribution(buckets: Int = 10): [SalaryBucket!]!

  """
  Employees left out: no rate for their currency
  """
  excludedCurrencies: [CurrencyHeadcount!]!
  includedHeadcount: Int!
  payStats(groupBy: PayGroupBy!, limit: Int = 50): [ConvertedPayStat!]!
  rateDate: ISO8601Date

  """
  One per currency in the selection that could be converted
  """
  rates: [ExchangeRate!]!
  reportingCurrency: Currency!
  source: String

  """
  True when the rates are more than 7 days old
  """
  stale: Boolean!
}

"""
Pay statistics in the reporting currency (each salary converted first, then aggregated)
"""
type ConvertedPayStat {
  avg: String!
  group: String!
  headcount: Int!
  max: String!
  median: String!
  min: String!
}

type Country {
  code: CountryCode!
  currency: Currency!
  name: String!
}

"""
Supported country (ISO-3166 alpha-2)
"""
enum CountryCode {
  """
  Australia
  """
  AU

  """
  Canada
  """
  CA

  """
  Germany
  """
  DE

  """
  France
  """
  FR

  """
  United Kingdom
  """
  GB

  """
  India
  """
  IN

  """
  Singapore
  """
  SG

  """
  United States
  """
  US
}

type CountryHeadcount {
  countryCode: CountryCode!
  countryName: String!
  headcount: Int!
}

"""
Supported currency (ISO-4217)
"""
enum Currency {
  AUD
  CAD
  EUR
  GBP
  INR
  SGD
  USD
}

type CurrencyHeadcount {
  currency: Currency!
  headcount: Int!
}

type Dashboard {
  """
  Indicative analytics in one reporting currency, with the rate, date and source of every conversion
  """
  converted(to: Currency!): ConvertedDashboard!
  countriesCount: Int!

  """
  Headcount per currency (never a combined amount)
  """
  currencies: [CurrencyHeadcount!]!

  """
  Salary histogram for one currency
  """
  distribution(buckets: Int = 10, currency: Currency!): [SalaryBucket!]!

  """
  Active employees
  """
  headcount: Int!
  headcountByCountry: [CountryHeadcount!]!
  headcountByDepartment: [DepartmentHeadcount!]!

  """
  Current employees by hire year, oldest first
  """
  hiresByYear: [YearHeadcount!]!
  payStats(
    """
    Only this currency (for single-currency charts)
    """
    currency: Currency
    groupBy: PayGroupBy!
    limit: Int = 50
  ): [PayStat!]!
}

"""
Narrow every dashboard widget to the same employees (active employees only)
"""
input DashboardFilters {
  country: [CountryCode!]
  department: [Department!]
  jobTitle: [String!]
}

"""
Department; the value is the department name (e.g. CUSTOMER_SUPPORT is "Customer Support")
"""
enum Department {
  """
  Customer Support
  """
  CUSTOMER_SUPPORT

  """
  Engineering
  """
  ENGINEERING

  """
  Finance
  """
  FINANCE

  """
  Marketing
  """
  MARKETING

  """
  Operations
  """
  OPERATIONS

  """
  People
  """
  PEOPLE

  """
  Product
  """
  PRODUCT

  """
  Sales
  """
  SALES
}

type DepartmentHeadcount {
  department: String!
  headcount: Int!
}

"""
The rate used to convert one currency: 1 `currency` = `rate` of the reporting currency
"""
type ExchangeRate {
  currency: Currency!

  """
  Exact decimal string (10 dp)
  """
  rate: String!

  """
  The date the reference rate was published for
  """
  rateDate: ISO8601Date!
  source: String!
}

"""
An ISO 8601-encoded date
"""
scalar ISO8601Date @specifiedBy(url: "https://tools.ietf.org/html/rfc3339")

"""
How to group salary statistics
"""
enum PayGroupBy {
  COUNTRY
  DEPARTMENT
  JOB_TITLE
}

"""
Salary statistics for one group in ONE currency. Amounts are exact decimal strings.
"""
type PayStat {
  """
  Mean, rounded to 2 decimals (half up)
  """
  avg: String!
  currency: Currency!
  group: String!
  headcount: Int!
  max: String!

  """
  Exact median; mean of the two middle values for an even count
  """
  median: String!
  min: String!
}

type Query {
  """
  Pay insights for active employees
  """
  dashboard(filters: DashboardFilters): Dashboard!
  reference: Reference!
}

"""
Values for filter dropdowns and currency choices
"""
type Reference {
  countries: [Country!]!
  currencies: [Currency!]!
  departments: [String!]!
  jobTitles: [String!]!
}

type SalaryBucket {
  count: Int!
  from: String!
  to: String!
}

type YearHeadcount {
  headcount: Int!
  year: Int!
}
