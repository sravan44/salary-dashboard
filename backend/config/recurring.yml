# Recurring jobs, run by Solid Queue's scheduler (inside Puma; see config/puma.rb).
# Schedules are cron expressions with an explicit time zone.

default: &default
  # The ECB publishes reference rates around 16:00 CET on working days.
  refresh_exchange_rates:
    class: FxRefreshJob
    queue: default
    schedule: "30 16 * * 1-5 Europe/Berlin"
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

development:
  <<: *default

production:
  <<: *default
