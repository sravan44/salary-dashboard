# Run the whole product locally: `docker compose up --build`, then open http://localhost:3000
# - app: one container (Rails API + built React app on the same origin)
# - db:  PostgreSQL, reachable only on the compose network (no host port)
# Works with no setup: the defaults below are for local use only. A .env file can override them.
# The app seeds 10,000 demo employees automatically the first time (empty database only).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      DB_HOST: db
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-local-compose-only-not-a-production-secret}
      FORCE_SSL: "false" # plain http on localhost; real hosts terminate TLS and keep the default (true)
      AUTO_SEED: "true"  # seed demo data on first start; an existing database is never touched
      GRAPHIQL_ENABLED: "true"  # GraphiQL at http://localhost:3000/graphiql; off by default in real deployments
      # Demo sign-ins: viewer@, hr@ and admin@acme.example. Local placeholder only; never set it in a real deployment.
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-local-demo-password}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
