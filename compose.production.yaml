# Production on one server (EC2 t3.micro), driven by Capistrano (deploy/): PostgreSQL, the app, and Caddy in front
# (HTTPS when APP_HOST is a domain). Run from a release folder:
#   docker compose -f compose.production.yaml up --detach --build
# Values come from the release's .env, a link to shared/.env on the server (see deploy/server-setup.sh).
# Compose refuses to start if a required secret is missing.
name: salary   # fixed project name: every release reuses the same containers and the same database volume

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: salary
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in shared/.env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salary"]
      interval: 5s
      timeout: 3s
      retries: 20
    # No ports: reachable only from the app container.

  app:
    build: .
    image: salary-dashboard:current
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_USER: salary
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in shared/.env}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE in shared/.env}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-}  # private demo sign-ins; empty = no demo users
      # true once APP_HOST is a domain (HTTPS through Caddy); false for plain HTTP on the IP.
      FORCE_SSL: ${FORCE_SSL:-false}
      AUTO_SEED: "true"          # seed the 10k demo data on the first start only
      GRAPHIQL_ENABLED: "false"
    # No published port: only Caddy reaches it, on the internal network.
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_HOST: ${APP_HOST:-:80}   # a domain name → automatic HTTPS; unset → plain HTTP on the IP
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"              # HTTP/3
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data           # certificates survive deploys and rollbacks
      - caddy-config:/config
    depends_on:
      - app

volumes:
  db-data:
  caddy-data:
  caddy-config:
